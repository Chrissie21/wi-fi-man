services:
  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      STORE_BACKEND: "postgres"
      DB_DSN: "postgres://wifi_man:wifi_man@postgres:5432/wifi_man?sslmode=disable"
      MIGRATIONS_PATH: "migrations"
      REDIS_ADDR: "redis:6379"
      ASYNQ_ENABLED: "true"
      ASYNQ_CONCURRENCY: "5"
      ASYNQ_SWEEP_CRON: "@every 1m"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "15"
      RATE_LIMIT_WINDOW_SECS: "60"
      GATEWAY_DISCONNECT_URL: ""
      GATEWAY_AUTH_TOKEN: ""
      RADIUS_ENABLED: "true"
      RADIUS_AUTH_ADDR: ":1812"
      RADIUS_ACCT_ADDR: ":1813"
      RADIUS_SECRET: "radius-secret-change-me"
      RADIUS_COA_ADDR: "127.0.0.1:3799"
      RADIUS_COA_SECRET: "radius-secret-change-me"
      ROUTEROS_API_URL: ""
      ROUTEROS_API_TOKEN: ""
      METRICS_ENABLED: "true"
      MOBILE_MONEY_SECRET: "change-me"
      PORTAL_TITLE: "Wi-Fi Access Portal"
      ADMIN_TOKEN_HEADER: "X-Role"
    depends_on:
      - redis
      - postgres
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"

  admin:
    build: ./frontend-admin
    ports:
      - "8081:80"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - admin

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: wifi_man
      POSTGRES_USER: wifi_man
      POSTGRES_PASSWORD: wifi_man
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.2.1
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.2
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
